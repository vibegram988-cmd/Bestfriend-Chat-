<!DOCTYPE html>
<html lang="en">

<head>

  <!-- ==========================================
       SECTION 1: PAGE SETTINGS
  ========================================== -->

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#11141D">

  <title>BestfriendChat</title>


  <!-- ==========================================
       SECTION 2: CSS FILE
  ========================================== -->

  <link rel="stylesheet" href="notification.css">

</head>

<body>

  <!-- ==========================================
       SECTION 3: TOP BAR
  ========================================== -->

  <header class="top-bar">

    <div class="brand-title">
      Bestfriend<span>Chat</span>
    </div>

  </header>


  <!-- ==========================================
       SECTION 4: NOTIFICATION STRIP
       BACK BUTTON + TITLE
  ========================================== -->

  <div class="icons-bar-background">

    <!-- BACK BUTTON -->

    <button
      class="notification-back-button"
      id="notificationBackButton"
      type="button"
      aria-label="Go back">

      <svg
        viewBox="0 0 24 24"
        width="24"
        height="24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true">

        <path d="M15 18l-6-6 6-6"></path>

      </svg>

    </button>


    <!-- NOTIFICATION TITLE -->

    <div class="notification-strip-title">
      Notification
    </div>

  </div>


  <!-- ==========================================
       SECTION 5: NOTIFICATION CONTENT
  ========================================== -->

  <main
    class="notification-container"
    id="notificationContainer">

    <!-- Notification content will appear here -->

  </main>


  <!-- ==========================================
       SECTION 6: BOTTOM NAVIGATION
  ========================================== -->

  <nav class="bottom-nav" aria-label="Main navigation">

    <!-- HOME -->

    <button
      class="nav-btn"
      type="button"
      data-nav="home"
      aria-label="Home">

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round">

        <path d="M3 10.5 12 3l9 7.5"></path>
        <path d="M5.5 9.5V21h13V9.5"></path>
        <path d="M9.5 21v-7h5v7"></path>

      </svg>

    </button>


    <!-- SEARCH -->

    <button
      class="nav-btn"
      type="button"
      data-nav="search"
      aria-label="Search">

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round">

        <circle cx="10.8" cy="10.8" r="6.8"></circle>
        <path d="m16 16 5 5"></path>

      </svg>

    </button>


    <!-- MESSAGES -->

    <button
      class="nav-btn"
      type="button"
      data-nav="messages"
      aria-label="Messages">

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round">

        <path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"></path>

      </svg>

    </button>


    <!-- REELS -->

    <button
      class="nav-btn"
      type="button"
      data-nav="reels"
      aria-label="Reels">

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round">

        <rect x="3" y="3" width="18" height="18" rx="4"></rect>
        <path d="m10 8 6 4-6 4z"></path>
        <path d="m7 3 5 6"></path>
        <path d="m15 3 5 6"></path>

      </svg>

    </button>


    <!-- PROFILE -->

    <button
      class="nav-btn"
      type="button"
      data-nav="profile"
      aria-label="Profile">

      <img
        src="app-icon.png"
        alt="Profile"
        class="nav-profile-image">

    </button>

  </nav>


  <!-- ==========================================
       SECTION 7: JAVASCRIPT FILE
  ========================================== -->

  <script src="notification.js"></script>

</body>
</html>
