<!DOCTYPE html>
<html lang="en">

<head>
  <!-- ==========================================
       SECTION 1: PAGE SETTINGS
  ========================================== -->
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>BestfriendChat</title>

  <!-- SECTION 2: CSS FILE -->
  <link rel="stylesheet" href="home.css">
</head>

<body>

  <!-- ==========================================
       SECTION 3: TOP BAR
  ========================================== -->
  <header class="top-bar">
    <div class="brand-title">
      Bestfriend<span>Chat</span>
    </div>
  </header>


  <!-- ==========================================
       SECTION 4: ICONS BAR BACKGROUND
  ========================================== -->
  <div
    class="icons-bar-background"
    aria-hidden="true"
  ></div>


  <!-- ==========================================
       SECTION 5: PLUS BUTTON
  ========================================== -->
  <button
    class="plus-icon-box"
    id="plusButton"
    type="button"
    aria-label="Create post or reel"
    aria-haspopup="true"
    aria-controls="createPopupOverlay"
    aria-expanded="false"
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      aria-hidden="true"
    >
      <path d="M12 5v14M5 12h14"></path>
    </svg>
  </button>


  <!-- ==========================================
       SECTION 6: CREATE POST / REEL POPUP
  ========================================== -->
  <div
    class="create-popup-overlay"
    id="createPopupOverlay"
    aria-hidden="true"
  >
    <div
      class="create-popup"
      role="dialog"
      aria-label="Create content"
      aria-modal="true"
    >

      <!-- CREATE POST -->
      <button
        class="create-option"
        id="createPostBtn"
        type="button"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect x="4" y="4" width="16" height="16" rx="3"></rect>
          <circle cx="9" cy="9" r="1.5"></circle>
          <path d="m5 17 5-5 3 3 2-2 4 4"></path>
        </svg>

        <span>Post</span>
      </button>

      <!-- CREATE REEL -->
      <button
        class="create-option"
        id="createReelBtn"
        type="button"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect x="3" y="4" width="18" height="16" rx="3"></rect>
          <path d="M3 9h18M8 4l4 5m2-5 4 5"></path>
          <path
            d="m10 12 5 3-5 3z"
            fill="currentColor"
            stroke="none"
          ></path>
        </svg>

        <span>Reel</span>
      </button>

    </div>
  </div>


  <!-- ==========================================
       SECTION 7: RIGHT-SIDE MENU BUTTON
  ========================================== -->
  <button
    class="menu-icon-box"
    type="button"
    aria-label="Open menu"
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      aria-hidden="true"
    >
      <path d="M4 6h16M4 12h16M4 18h16"></path>
    </svg>
  </button>


  <!-- ==========================================
       SECTION 8: NOTIFICATION BUTTON
  ========================================== -->
  <button
    class="heart-icon-box"
    id="notificationButton"
    type="button"
    aria-label="Notifications"
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"></path>
    </svg>
  </button>


  <!-- ==========================================
       SECTION 9: ICONS DIVIDER
  ========================================== -->
  <div
    class="options-divider"
    aria-hidden="true"
  ></div>


  <!-- ==========================================
       SECTION 10: STORY BAR BACKGROUND
  ========================================== -->
  <div
    class="story-bar-background"
    aria-hidden="true"
  ></div>


  <!-- ==========================================
       SECTION 11: MY STORY PROFILE
  ========================================== -->
  <div class="story-add-box">

    <div class="story-profile-dp">
      <img
        src="unkenow-icon.png"
        alt="My profile"
      >
    </div>

    <button
      class="story-plus-badge"
      type="button"
      aria-label="Add story"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <path d="M12 5v14M5 12h14"></path>
      </svg>
    </button>

  </div>


  <!-- ==========================================
       SECTION 12: STORY BOTTOM DIVIDER
  ========================================== -->
  <div
    class="story-bottom-divider"
    aria-hidden="true"
  ></div>


  <!-- ==========================================
       SECTION 13: POSTS CONTAINER
  ========================================== -->
  <main class="posts-container">

    <!-- SECTION 14: POST CARD -->
    <article class="post-card">

      <!-- ==========================================
           SECTION 15: POST USER DETAILS + THREE DOTS
      ========================================== -->
      <div class="post-user-header">

        <!-- USER PROFILE -->
        <img
          class="post-user-dp"
          src="unkenow-icon.png"
          alt="User profile"
        >

        <!-- USER DETAILS -->
        <div class="post-user-info">

          <div class="post-user-name">
            User Name
          </div>

          <div class="post-user-meta">
            <span class="post-user-id">ID: 100001</span>
            <span class="post-user-username">@username</span>
          </div>

        </div>

        <!-- THREE-DOT MENU BUTTON -->
        <button
          class="post-more-button"
          type="button"
          aria-label="Post options"
          title="Post options"
        >
          <svg
            viewBox="0 0 24 24"
            width="24"
            height="24"
            fill="currentColor"
            aria-hidden="true"
          >
            <circle cx="12" cy="5" r="1.8"></circle>
            <circle cx="12" cy="12" r="1.8"></circle>
            <circle cx="12" cy="19" r="1.8"></circle>
          </svg>
        </button>

      </div>


      <!-- ==========================================
           SECTION 16: POST IMAGE
      ========================================== -->
      <div class="post-media">
        <img
          src="post-media.png"
          alt="Post image"
        >
      </div>


      <!-- ==========================================
           SECTION 17: POST ACTION BUTTONS
      ========================================== -->
      <div class="post-actions">

        <!-- SECTION 18: LIKE BUTTON -->
        <button
          class="post-action-btn"
          id="postLikeButton"
          type="button"
          aria-label="Like post"
          aria-pressed="false"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"></path>
          </svg>

          <span class="post-count" id="postLikeCount">0</span>
        </button>


        <!-- SECTION 19: COMMENT BUTTON -->
        <button
          class="post-action-btn"
          id="postCommentButton"
          type="button"
          aria-label="Comment on post"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8A8.5 8.5 0 0 1 8.7 3.9a8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8z"></path>
          </svg>

          <span class="post-count" id="postCommentCount">0</span>
        </button>


        <!-- SECTION 20: SHARE BUTTON -->
        <button
          class="post-action-btn post-action-share"
          id="postShareButton"
          type="button"
          aria-label="Share post"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M12 16V3"></path>
            <path d="m7 8 5-5 5 5"></path>
            <path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"></path>
          </svg>
        </button>

      </div>

    </article>

  </main>


  <!-- ==========================================
       SECTION 21: BOTTOM NAVIGATION
  ========================================== -->
  <nav
    class="bottom-nav"
    aria-label="Main navigation"
  >

    <!-- SECTION 22: HOME BUTTON -->
    <button
      class="nav-btn active"
      type="button"
      aria-label="Home"
      data-nav="home"
      aria-current="page"
      onclick="window.location.href='home.html'"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M3 10.6 12 3l9 7.6V20a1 1 0 0 1-1 1h-5v-6.5a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1V21H4a1 1 0 0 1-1-1z"></path>
      </svg>
    </button>


    <!-- SECTION 23: SEARCH BUTTON -->
    <button
      class="nav-btn"
      id="searchNavButton"
      type="button"
      aria-label="Search"
      data-nav="search"
      onclick="window.location.href='search.html'"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <circle cx="11" cy="11" r="7.5"></circle>
        <path d="m21 21-4.6-4.6"></path>
      </svg>
    </button>


    <!-- SECTION 24: MESSAGES BUTTON -->
    <button
      class="nav-btn"
      id="messagesNavButton"
      type="button"
      aria-label="Messages"
      data-nav="messages"
      onclick="window.location.href='message.html'"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M22 3 2.8 9.9l7.4 3.2 3.2 7.5z"></path>
        <path d="m22 3-11.8 10.1"></path>
      </svg>
    </button>


<!-- SECTION 25: REELS BUTTON -->
<button
  class="nav-btn"
  id="reelsNavButton"
  type="button"
  aria-label="Reels"
  data-nav="reels"
  onclick="window.location.href='reel.html'"
>
  <svg
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <rect x="3" y="3" width="18" height="18" rx="5"></rect>
    <path d="M3.5 8.5h17M8.5 3.2l3 5.3M14.5 3.2l3 5.3"></path>
    <path
      class="nav-play"
      d="M10 12.6v5l4.4-2.5z"
    ></path>
  </svg>
</button>


    <!-- SECTION 26: PROFILE BUTTON -->
<button
  class="nav-btn"
  type="button"
  aria-label="Profile"
  data-nav="profile"
  onclick="window.location.href='profile.html'"
>
  <span class="nav-profile-dp">
    <img
      src="app-icon.png"
      alt="Profile"
    >
  </span>
</button>

  </nav>


  <!-- ==========================================
       SECTION 27: EXTERNAL JAVASCRIPT
       All JavaScript stays in home.js
  ========================================== -->
  <script type="module" src="home.js"></script>

</body>
</html>
