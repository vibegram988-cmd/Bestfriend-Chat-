<!DOCTYPE html>
<html lang="en">

<head>
  <!-- ==========================================
       SECTION 1: PAGE SETTINGS
  ========================================== -->
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Reels | BestfriendChat</title>

  <!-- SECTION 2: CSS FILE -->
  <link rel="stylesheet" href="reel.css">
</head>

<body>

  <!-- ==========================================
       SECTION 3: TOP BAR
       Same as Message Page
  ========================================== -->

  <header class="top-bar">

    <div class="brand-title">
      Bestfriend<span>Chat</span>
    </div>

  </header>


  <!-- ==========================================
       SECTION 4: REELS CONTENT
       Reel video content will go here
  ========================================== -->

  <main class="reels-container" id="reelsContainer">

    <!-- Reel videos will be added here using reel.js -->

  </main>


  <!-- ==========================================
       SECTION 5: BOTTOM NAVIGATION
       Home | Search | Msg | Reel | Profile
  ========================================== -->

  <nav
    class="bottom-nav"
    aria-label="Main navigation"
  >

    <!-- HOME BUTTON -->
    <button
      class="nav-btn"
      type="button"
      aria-label="Home"
      data-nav="home"
      onclick="window.location.href='home.html'"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M3 10.6 12 3l9 7.6V20a1 1 0 0 1-1 1h-5v-6.5a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1V21H4a1 1 0 0 1-1-1z"></path>
      </svg>
    </button>


    <!-- SEARCH BUTTON -->
    <button
      class="nav-btn"
      type="button"
      aria-label="Search"
      data-nav="search"
      onclick="window.location.href='search.html'"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <circle cx="11" cy="11" r="7.5"></circle>
        <path d="m21 21-4.6-4.6"></path>
      </svg>
    </button>


    <!-- MESSAGES BUTTON -->
    <button
      class="nav-btn"
      type="button"
      aria-label="Messages"
      data-nav="messages"
      onclick="window.location.href='message.html'"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M22 3 2.8 9.9l7.4 3.2 3.2 7.5z"></path>
        <path d="m22 3-11.8 10.1"></path>
      </svg>
    </button>


    <!-- REELS BUTTON: ACTIVE -->
    <button
      class="nav-btn active"
      type="button"
      aria-label="Reels"
      data-nav="reels"
      aria-current="page"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <rect x="3" y="3" width="18" height="18" rx="5"></rect>
        <path d="M3.5 8.5h17M8.5 3.2l3 5.3M14.5 3.2l3 5.3"></path>
        <path
          class="nav-play"
          d="M10 12.6v5l4.4-2.5z"
        ></path>
      </svg>
    </button>


    <!-- PROFILE BUTTON -->
    <button
      class="nav-btn"
      type="button"
      aria-label="Profile"
      data-nav="profile"
      onclick="alert('Profile page abhi ready nahi hai.')"
    >
      <span class="nav-profile-dp">
        <img
          src="unkenow-icon.png"
          alt="Profile"
        >
      </span>
    </button>

  </nav>


  <!-- ==========================================
       SECTION 6: JAVASCRIPT
  ========================================== -->

  <script src="reel.js"></script>

</body>
</html>
