<!DOCTYPE html>
<html lang="en">

<head>

  <!-- ==========================================
       SECTION 1: PAGE SETTINGS
  ========================================== -->

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#11141D">

  <title>BestfriendChat - Story</title>


  <!-- ==========================================
       SECTION 2: CSS FILES
  ========================================== -->

  <link rel="stylesheet" href="home.css">
  <link rel="stylesheet" href="story.css">

</head>

<body>

  <!-- ==========================================
       SECTION 3: TOP BAR
  ========================================== -->

  <header class="top-bar">

    <div class="brand-title">
      Bestfriend<span>Chat</span>
    </div>

  </header>


  <!-- ==========================================
       SECTION 4: STORY STRIP
       BACK BUTTON + TITLE
  ========================================== -->

  <div class="icons-bar-background story-strip">

    <!-- BACK BUTTON -->

    <button
      class="story-back-button"
      id="storyBackButton"
      type="button"
      aria-label="Go back">

      <svg
        viewBox="0 0 24 24"
        width="24"
        height="24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true">

        <path d="M15 18l-6-6 6-6"></path>

      </svg>

    </button>


    <!-- STORY TITLE -->

    <div class="notification-strip-title">
      Story
    </div>

  </div>


  <!-- ==========================================
       SECTION 5: STORY CONTENT
  ========================================== -->

  <main
    class="story-page-content"
    id="storyPageContent">
  </main>

  <!-- ==========================================
       SECTION 7: JAVASCRIPT
  ========================================== -->

  <script src="story.js"></script>

</body>
</html>
